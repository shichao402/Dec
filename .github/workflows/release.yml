# 产品流水线只生产、合并 ArtifactSet。RUP endpoint、上传 token、签名私钥和
# publish transaction 只属于独立 Operator；本 workflow 不接触它们。

name: Release

on:
  push:
    tags:
      - "dev/v*"
      - "stable/v*"
  workflow_dispatch:
    inputs:
      channel:
        description: RUP channel when not triggered by a channel tag
        type: choice
        options:
          - dev
          - stable
        default: dev
concurrency:
  group: dec-artifacts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELKIT_CANDIDATE_ROOT_FINGERPRINT: ${{ vars.RELKIT_CANDIDATE_ROOT_FINGERPRINT }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and channel
        id: meta
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'dev' }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          case "$TAG" in
            dev/*)
              CHANNEL=dev
              VERSION="${TAG#dev/}"
              ;;
            stable/*)
              CHANNEL=stable
              VERSION="${TAG#stable/}"
              ;;
            *)
              CHANNEL="${RELEASE_CHANNEL:-dev}"
              VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
              echo "非渠道 tag 触发（ref=$TAG），使用 version.json=$VERSION channel=$CHANNEL"
              ;;
          esac

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无效版本号: $VERSION（期望 vMAJOR.MINOR.PATCH）"
            exit 1
          fi
          if [[ "$CHANNEL" != "dev" && "$CHANNEL" != "stable" ]]; then
            echo "无效渠道: $CHANNEL（期望 dev 或 stable）"
            exit 1
          fi

          FILE_VER=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          if [ "$FILE_VER" != "$VERSION" ]; then
            echo "version.json ($FILE_VER) 与发布版本 ($VERSION) 不一致"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION channel=$CHANNEL tag=$TAG"

  test:
    name: test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Install signed Operator bundle
        env:
          OPS_URL: ${{ vars.RELKIT_OPS_LINUX_URL }}
          OPS_SHA256: ${{ vars.RELKIT_OPS_LINUX_SHA256 }}
          BUNDLE_URL: ${{ vars.RELKIT_BUNDLE_URL }}
          BUNDLE_SHA256: ${{ vars.RELKIT_BUNDLE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$OPS_URL" && test -n "$OPS_SHA256"
          test -n "$BUNDLE_URL" && test -n "$BUNDLE_SHA256"
          curl -fsSL "$OPS_URL" -o "$RUNNER_TEMP/relkit-ops"
          test "$(sha256sum "$RUNNER_TEMP/relkit-ops" | awk '{print $1}')" = "$OPS_SHA256"
          chmod 755 "$RUNNER_TEMP/relkit-ops"
          curl -fsSL "$BUNDLE_URL" -o "$RUNNER_TEMP/relkit-bundle.zip"
          test "$(sha256sum "$RUNNER_TEMP/relkit-bundle.zip" | awk '{print $1}')" = "$BUNDLE_SHA256"
          unzip -q "$RUNNER_TEMP/relkit-bundle.zip" -d "$RUNNER_TEMP/relkit-bundle"
          "$RUNNER_TEMP/relkit-ops" bundle install \
            --bundle "$RUNNER_TEMP/relkit-bundle" \
            --project relkit.project.json \
            --project-root "$GITHUB_WORKSPACE" \
            --home "$RUNNER_TEMP/relkit-home" \
            --target linux-amd64 \
            --candidate-root-fingerprint "$RELKIT_CANDIDATE_ROOT_FINGERPRINT"
          echo "RELKIT_HOME=$RUNNER_TEMP/relkit-home" >> "$GITHUB_ENV"

      - name: go test
        run: |
          ./relkitw doctor
          GOFLAGS="-modfile=.relkit/components/sdk/go/relkit.mod" go test ./...

  build:
    name: ArtifactSet (${{ matrix.target }})
    needs: [prepare, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            host_target: linux-amd64
          - target: linux-arm64
            runner: ubuntu-latest
            host_target: linux-amd64
          - target: windows-amd64
            runner: windows-latest
            host_target: windows-amd64
          - target: darwin-amd64
            runner: macos-15-intel
            host_target: darwin-amd64
          - target: darwin-arm64
            runner: macos-15
            host_target: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          prefix-key: rust-cache-${{ runner.os }}

      - name: Install signed Operator bundle (Unix)
        if: runner.os != 'Windows'
        env:
          OPS_URL: ${{ runner.os == 'macOS' && vars.RELKIT_OPS_DARWIN_URL || vars.RELKIT_OPS_LINUX_URL }}
          OPS_SHA256: ${{ runner.os == 'macOS' && vars.RELKIT_OPS_DARWIN_SHA256 || vars.RELKIT_OPS_LINUX_SHA256 }}
          BUNDLE_URL: ${{ vars.RELKIT_BUNDLE_URL }}
          BUNDLE_SHA256: ${{ vars.RELKIT_BUNDLE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$OPS_URL" && test -n "$OPS_SHA256"
          test -n "$BUNDLE_URL" && test -n "$BUNDLE_SHA256"
          curl -fsSL "$OPS_URL" -o "$RUNNER_TEMP/relkit-ops"
          if [ "$RUNNER_OS" = macOS ]; then HASH="$(shasum -a 256 "$RUNNER_TEMP/relkit-ops" | awk '{print $1}')"; else HASH="$(sha256sum "$RUNNER_TEMP/relkit-ops" | awk '{print $1}')"; fi
          test "$HASH" = "$OPS_SHA256"
          chmod 755 "$RUNNER_TEMP/relkit-ops"
          curl -fsSL "$BUNDLE_URL" -o "$RUNNER_TEMP/relkit-bundle.zip"
          if [ "$RUNNER_OS" = macOS ]; then HASH="$(shasum -a 256 "$RUNNER_TEMP/relkit-bundle.zip" | awk '{print $1}')"; else HASH="$(sha256sum "$RUNNER_TEMP/relkit-bundle.zip" | awk '{print $1}')"; fi
          test "$HASH" = "$BUNDLE_SHA256"
          unzip -q "$RUNNER_TEMP/relkit-bundle.zip" -d "$RUNNER_TEMP/relkit-bundle"
          "$RUNNER_TEMP/relkit-ops" bundle install \
            --bundle "$RUNNER_TEMP/relkit-bundle" \
            --project relkit.project.json \
            --project-root "$GITHUB_WORKSPACE" \
            --home "$RUNNER_TEMP/relkit-home" \
            --target "${{ matrix.host_target }}" \
            --candidate-root-fingerprint "$RELKIT_CANDIDATE_ROOT_FINGERPRINT"
          echo "RELKIT_HOME=$RUNNER_TEMP/relkit-home" >> "$GITHUB_ENV"

      - name: Install signed Operator bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OPS_URL: ${{ vars.RELKIT_OPS_WINDOWS_URL }}
          OPS_SHA256: ${{ vars.RELKIT_OPS_WINDOWS_SHA256 }}
          BUNDLE_URL: ${{ vars.RELKIT_BUNDLE_URL }}
          BUNDLE_SHA256: ${{ vars.RELKIT_BUNDLE_SHA256 }}
        run: |
          if (-not $env:OPS_URL -or -not $env:OPS_SHA256 -or
              -not $env:BUNDLE_URL -or -not $env:BUNDLE_SHA256) {
            throw "Relkit Operator bundle variables are not configured"
          }
          $ops = Join-Path $env:RUNNER_TEMP "relkit-ops.exe"
          $archive = Join-Path $env:RUNNER_TEMP "relkit-bundle.zip"
          $bundle = Join-Path $env:RUNNER_TEMP "relkit-bundle"
          Invoke-WebRequest -UseBasicParsing $env:OPS_URL -OutFile $ops
          if ((Get-FileHash $ops -Algorithm SHA256).Hash.ToLower() -ne $env:OPS_SHA256.ToLower()) {
            throw "relkit-ops digest mismatch"
          }
          Invoke-WebRequest -UseBasicParsing $env:BUNDLE_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $env:BUNDLE_SHA256.ToLower()) {
            throw "Operator bundle digest mismatch"
          }
          Expand-Archive -Path $archive -DestinationPath $bundle -Force
          $home = Join-Path $env:RUNNER_TEMP "relkit-home"
          & $ops bundle install --bundle $bundle --project relkit.project.json `
            --project-root $env:GITHUB_WORKSPACE --home $home --target "${{ matrix.host_target }}" `
            --candidate-root-fingerprint $env:RELKIT_CANDIDATE_ROOT_FINGERPRINT
          if ($LASTEXITCODE -ne 0) { throw "Operator bundle install failed" }
          "RELKIT_HOME=$home" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Produce ArtifactSet (Unix)
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          ./relkitw artifacts produce \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --target "${{ matrix.target }}" \
            --out-dir "dist/relkit-artifact-set/${{ matrix.target }}" \
            --out "dist/relkit-artifact-set/${{ matrix.target }}/artifact-set.json"

      - name: Produce ArtifactSet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          .\relkitw.cmd artifacts produce `
            --version $env:VERSION `
            --channel $env:CHANNEL `
            --target "${{ matrix.target }}" `
            --out-dir "dist/relkit-artifact-set/${{ matrix.target }}" `
            --out "dist/relkit-artifact-set/${{ matrix.target }}/artifact-set.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: relkit-artifact-set-${{ matrix.target }}
          path: dist/relkit-artifact-set/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Merge ArtifactSets
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install signed Operator bundle
        env:
          OPS_URL: ${{ vars.RELKIT_OPS_LINUX_URL }}
          OPS_SHA256: ${{ vars.RELKIT_OPS_LINUX_SHA256 }}
          BUNDLE_URL: ${{ vars.RELKIT_BUNDLE_URL }}
          BUNDLE_SHA256: ${{ vars.RELKIT_BUNDLE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$OPS_URL" && test -n "$OPS_SHA256"
          test -n "$BUNDLE_URL" && test -n "$BUNDLE_SHA256"
          curl -fsSL "$OPS_URL" -o "$RUNNER_TEMP/relkit-ops"
          test "$(sha256sum "$RUNNER_TEMP/relkit-ops" | awk '{print $1}')" = "$OPS_SHA256"
          chmod 755 "$RUNNER_TEMP/relkit-ops"
          curl -fsSL "$BUNDLE_URL" -o "$RUNNER_TEMP/relkit-bundle.zip"
          test "$(sha256sum "$RUNNER_TEMP/relkit-bundle.zip" | awk '{print $1}')" = "$BUNDLE_SHA256"
          unzip -q "$RUNNER_TEMP/relkit-bundle.zip" -d "$RUNNER_TEMP/relkit-bundle"
          "$RUNNER_TEMP/relkit-ops" bundle install \
            --bundle "$RUNNER_TEMP/relkit-bundle" \
            --project relkit.project.json \
            --project-root "$GITHUB_WORKSPACE" \
            --home "$RUNNER_TEMP/relkit-home" \
            --target linux-amd64 \
            --candidate-root-fingerprint "$RELKIT_CANDIDATE_ROOT_FINGERPRINT"
          echo "RELKIT_HOME=$RUNNER_TEMP/relkit-home" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: relkit-artifact-set-*
          path: artifacts

      - name: Merge and verify five ArtifactSets
        run: |
          ./relkitw artifacts merge \
            --in artifacts/relkit-artifact-set-linux-amd64/artifact-set.json \
            --in artifacts/relkit-artifact-set-linux-arm64/artifact-set.json \
            --in artifacts/relkit-artifact-set-windows-amd64/artifact-set.json \
            --in artifacts/relkit-artifact-set-darwin-amd64/artifact-set.json \
            --in artifacts/relkit-artifact-set-darwin-arm64/artifact-set.json \
            --out dist/relkit-artifact-set/merged/artifact-set.json

      - uses: actions/upload-artifact@v4
        with:
          name: relkit-artifact-set-merged
          path: dist/relkit-artifact-set/merged/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare stable Console installers
        if: needs.prepare.outputs.channel == 'stable'
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path("dist/relkit-artifact-set/merged")
          doc = json.loads((root / "artifact-set.json").read_text())
          release = Path("release-assets")
          release.mkdir()
          consoles = [
              item for item in doc["artifacts"]
              if item["kind"] == "installer"
              and item["selectors"].get("component") == "console"
              and item["selectors"].get("audience") == "user"
          ]
          if len(consoles) != 3:
              raise SystemExit(f"expected three Console installers, got {len(consoles)}")
          for item in consoles:
              source = root / item["path"]
              shutil.copy2(source, release / source.name)
          PY

      - name: Upload stable Console installers
        if: needs.prepare.outputs.channel == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: dec-stable-installers
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  operator-publish:
    name: Operator publish and verify
    needs: [prepare, collect]
    runs-on: ubuntu-latest
    environment: relkit-operator
    steps:
      - uses: actions/checkout@v4

      - name: Install signed Operator bundle
        env:
          OPS_URL: ${{ vars.RELKIT_OPS_LINUX_URL }}
          OPS_SHA256: ${{ vars.RELKIT_OPS_LINUX_SHA256 }}
          BUNDLE_URL: ${{ vars.RELKIT_BUNDLE_URL }}
          BUNDLE_SHA256: ${{ vars.RELKIT_BUNDLE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$OPS_URL" && test -n "$OPS_SHA256"
          test -n "$BUNDLE_URL" && test -n "$BUNDLE_SHA256"
          curl -fsSL "$OPS_URL" -o "$RUNNER_TEMP/relkit-ops"
          test "$(sha256sum "$RUNNER_TEMP/relkit-ops" | awk '{print $1}')" = "$OPS_SHA256"
          chmod 755 "$RUNNER_TEMP/relkit-ops"
          curl -fsSL "$BUNDLE_URL" -o "$RUNNER_TEMP/relkit-bundle.zip"
          test "$(sha256sum "$RUNNER_TEMP/relkit-bundle.zip" | awk '{print $1}')" = "$BUNDLE_SHA256"
          unzip -q "$RUNNER_TEMP/relkit-bundle.zip" -d "$RUNNER_TEMP/relkit-bundle"
          "$RUNNER_TEMP/relkit-ops" bundle install \
            --bundle "$RUNNER_TEMP/relkit-bundle" \
            --project relkit.project.json \
            --project-root "$GITHUB_WORKSPACE" \
            --home "$RUNNER_TEMP/relkit-home" \
            --target linux-amd64 \
            --candidate-root-fingerprint "$RELKIT_CANDIDATE_ROOT_FINGERPRINT"
          echo "RELKIT_HOME=$RUNNER_TEMP/relkit-home" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: relkit-artifact-set-merged
          path: dist/relkit-artifact-set/merged

      - name: Publish and verify signed release
        env:
          RELKIT_UPLOAD_TOKEN: ${{ secrets.RELKIT_UPLOAD_TOKEN }}
          RELKIT_RELEASE_VIA_CI: "1"
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          test -n "$RELKIT_UPLOAD_TOKEN"
          ./relkitw stage \
            --artifact-set dist/relkit-artifact-set/merged/artifact-set.json
          ./relkitw release --version "$VERSION"
          ./relkitw release --version "$VERSION" --execute
          ./relkitw verify released --version "$VERSION" --channel "$CHANNEL"

  stable-release:
    name: Stable GitHub Release
    if: needs.prepare.outputs.channel == 'stable'
    needs: [prepare, collect, operator-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dec-stable-installers
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: stable/${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
            Dec `${{ needs.prepare.outputs.version }}`

            本页提供 Console 人工安装包；同一版本已通过独立 Operator 完成
            RUP 发布和 released-state 验证。
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
