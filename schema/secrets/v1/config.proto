syntax = "proto3";

package secrets.v1;

option go_package = "github.com/shichao402/Dec/schema/secrets/v1;secretsv1";

// SecretsConfig 描述 bundle 级与 project 级 Bitwarden secrets 绑定。
// 通常由 pull 流程根据 enabled Dec bundle 与 project_name 自动解析；也可显式配置。
message SecretsConfig {
  BundleBinding bundle = 1;
  // project 级 secrets 的 Bitwarden folder 名；未设时回退 project_name。
  string project_secrets = 2 [json_name = "project_secrets"];
}

// BundleBinding 描述 Dec bundle 与 Bitwarden secrets bundle 的镜像关系。
// 两者 bundle 目录结构同构；敏感文件落地项目根相对路径，不进 .dec/。
message BundleBinding {
  // Dec Git Vault 中的 bundle 名（与 enabled_bundles 条目对应）。
  string dec_bundle_name = 1 [json_name = "dec_bundle"];
  // Bitwarden secrets bundle / folder 名；默认同 dec_bundle_name。
  string secrets_bundle_name = 2 [json_name = "secrets_bundle"];
  // 密钥产物落地目录（相对项目根）；默认同项目根。
  string target_dir = 3 [json_name = "target_dir"];
}
