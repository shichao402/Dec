# Dec 按 relkit 渠道 tag 发版：
#   git tag  dev/vX.Y.Z    && git push origin  dev/vX.Y.Z     → RUP channel=dev
#   git tag  stable/vX.Y.Z && git push origin  stable/vX.Y.Z  → RUP channel=stable
# 推送前请先把 version.json 改成对应 vX.Y.Z 并推到 main。
# 密钥（仓库 Secrets）：
#   RELKIT_AGENT_TOKEN（必填才发 COS）
#   RELKIT_AGENT_URL（可选，可写站点根或 /v1，默认 https://publish.firoyang.com/v1）
# 手动触发：Actions → Release → Run workflow（按 version.json，默认 channel=dev）
#
# Console 必须在对应 OS 的 GitHub-hosted runner 上原生构建（Tauri 不能从 Linux 交叉出 NSIS/DMG）。
# 四件套仍在 Ubuntu 上 Go 交叉编译。publish 把两类产物汇进同一次 relkit stage。

name: Release

on:
  push:
    tags:
      - "dev/v*"
      - "stable/v*"
  workflow_dispatch:
    inputs:
      channel:
        description: RUP channel when not triggered by a channel tag
        type: choice
        options:
          - dev
          - stable
        default: dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and channel
        id: meta
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'dev' }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-}"
          case "$TAG" in
            dev/*)
              CHANNEL=dev
              VERSION="${TAG#dev/}"
              ;;
            stable/*)
              CHANNEL=stable
              VERSION="${TAG#stable/}"
              ;;
            *)
              CHANNEL="${RELEASE_CHANNEL:-dev}"
              VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
              echo "非渠道 tag 触发（ref=$TAG），使用 version.json=$VERSION channel=$CHANNEL"
              ;;
          esac

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无效版本号: $VERSION（期望 vMAJOR.MINOR.PATCH）"
            exit 1
          fi
          if [[ "$CHANNEL" != "dev" && "$CHANNEL" != "stable" ]]; then
            echo "无效渠道: $CHANNEL（期望 dev 或 stable）"
            exit 1
          fi

          FILE_VER=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          if [ "$FILE_VER" != "$VERSION" ]; then
            echo "version.json ($FILE_VER) 与发布版本 ($VERSION) 不一致"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION channel=$CHANNEL tag=$TAG"

  test:
    name: test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Fetch relkit SDK
        shell: bash
        run: python3 scripts/ensure_relkit_sparse.py --sdk-only --ref 6c78d29fbd54efa87e6adf189fb9b7b277accd7c

      - name: go test
        shell: bash
        run: go test ./...

  runtime:
    name: runtime
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Fetch relkit SDK
        shell: bash
        run: python3 scripts/ensure_relkit_sparse.py --sdk-only --ref 6c78d29fbd54efa87e6adf189fb9b7b277accd7c

      - name: Build four-piece kit
        shell: bash
        run: bash scripts/build.sh --all

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gen_checksums.py dist version.json
          cp version.json dist/dec-runtime-manifest.json

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime
          if-no-files-found: error
          path: |
            dist/dec-*
            version.json

  console:
    name: console (${{ matrix.name }})
    needs: [prepare, test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
          - name: windows-amd64
            runner: windows-latest
          - name: darwin-arm64
            runner: macos-latest
          - name: darwin-amd64
            runner: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch relkit SDK
        run: python scripts/ensure_relkit_sparse.py --sdk-only --ref 6c78d29fbd54efa87e6adf189fb9b7b277accd7c

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux GUI deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget

      - name: Build native Console
        shell: bash
        run: python scripts/build-console.py

      - name: Upload Console installer
        uses: actions/upload-artifact@v4
        with:
          name: console-${{ matrix.name }}
          path: dist/dec-console-*
          if-no-files-found: error

  publish:
    name: publish
    needs: [prepare, runtime, console]
    runs-on: ubuntu-latest
    env:
      RELKIT_AGENT_TOKEN: ${{ secrets.RELKIT_AGENT_TOKEN }}
      RELKIT_AGENT_URL: ${{ secrets.RELKIT_AGENT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Assemble dist/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ -d collected/runtime/dist ]; then
            cp -a collected/runtime/dist/. dist/
          fi
          if [ -f collected/runtime/version.json ]; then
            cp collected/runtime/version.json version.json
          fi
          if [ ! -f dist/dec-runtime-manifest.json ] && [ -f version.json ]; then
            cp version.json dist/dec-runtime-manifest.json
          fi
          for d in collected/console-*; do
            [ -d "$d" ] || continue
            if [ -d "$d/dist" ]; then
              cp -a "$d/dist"/. dist/
            else
              cp -a "$d"/. dist/
            fi
          done
          echo "assembled dist:"
          ls -la dist

          missing=0
          for f in \
            dist/dec-console-linux-amd64.AppImage \
            dist/dec-console-windows-amd64.exe \
            dist/dec-console-darwin-arm64.dmg \
            dist/dec-console-darwin-amd64.dmg
          do
            if [ ! -f "$f" ]; then
              echo "缺少 Console 产物: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Fetch relkit
        shell: bash
        run: python3 scripts/ensure_relkit_sparse.py --sdk-only --ref 6c78d29fbd54efa87e6adf189fb9b7b277accd7c

      - name: RUP stage and publish
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          if [ -z "${RELKIT_AGENT_TOKEN:-}" ]; then
            # 渠道 tag 已经推出去了，产物却进不了 RUP：这一步必须红，
            # 否则「CI 全绿 + 什么都没发」只能靠翻日志才发现。
            if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              echo "RELKIT_AGENT_TOKEN 未配置，${GITHUB_REF_NAME} 无法发到 RUP"
              exit 1
            fi
            echo "RELKIT_AGENT_TOKEN 未配置，非渠道 tag 触发，跳过 RUP 发布"
            exit 0
          fi
          ( cd third_party/relkit && go build -o "$OLDPWD/relkit-bin" ./cmd/relkit )
          CODE=$(python3 -c "maj,min,pat='${VER}'.split('.'); print(int(maj)*1000000+int(min)*1000+int(pat))")
          set -- stage "$VER" --code "$CODE" --channel "$CHANNEL"
          for f in dist/dec-*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *-linux-amd64) os=linux; arch=amd64 ;;
              *-linux-arm64) os=linux; arch=arm64 ;;
              *-darwin-amd64) os=darwin; arch=amd64 ;;
              *-darwin-arm64) os=darwin; arch=arm64 ;;
              *-windows-amd64.exe) os=windows; arch=amd64 ;;
              *) continue ;;
            esac
            component="${base%-${os}-${arch}*}"
            set -- "$@" --add "$f" "id=$base,kind=binary,os=$os,arch=$arch,component=$component,audience=runtime"
          done
          set -- "$@" --add "dist/dec-runtime-manifest.json" \
            "id=dec-runtime-manifest,filename=dec-runtime-manifest.json,kind=blob,component=manifest,audience=runtime"
          for f in dist/dec-console-*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              dec-console-linux-amd64.*) os=linux; arch=amd64 ;;
              dec-console-linux-arm64.*) os=linux; arch=arm64 ;;
              dec-console-darwin-amd64.*) os=darwin; arch=amd64 ;;
              dec-console-darwin-arm64.*) os=darwin; arch=arm64 ;;
              dec-console-windows-amd64.*) os=windows; arch=amd64 ;;
              *) continue ;;
            esac
            set -- "$@" --add "$f" "id=dec-console-${os}-${arch},os=$os,arch=$arch,component=console,audience=user"
          done
          ./relkit-bin "$@"
          tar -C ".relkit/staged/${VER}" -czf staged.tar.gz .
          AGENT_URL="${RELKIT_AGENT_URL:-https://publish.firoyang.com/v1}"
          AGENT_URL="${AGENT_URL%/}"
          case "$AGENT_URL" in
            */v1) ;;
            *) AGENT_URL="${AGENT_URL}/v1" ;;
          esac
          SHA=$(sha256sum staged.tar.gz | awk '{print $1}')
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${RELKIT_AGENT_TOKEN}" \
            --data-binary @staged.tar.gz \
            "${AGENT_URL}/staged/dec/${VER}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RELKIT_AGENT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"product\":\"dec\",\"version\":\"${VER}\",\"stagedSha256\":\"${SHA}\",\"idempotencyKey\":\"dec/${CHANNEL}/${VER}/${SHA}\"}" \
            "${AGENT_URL}/publish"

      - name: GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" != "stable" ]; then
            echo "channel=$CHANNEL，跳过 GitHub Release（仅 stable 推）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # install.sh 从 main 取 version.json 校验摘要，故带 checksums 的
          # version.json 必须先提交到主干。
          if ! git diff --quiet -- version.json; then
            git add version.json
            git commit -m "chore: 发布 ${VERSION} 产物摘要"
            git push origin HEAD:refs/heads/main
          fi
          if ! git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            git tag "${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi
          # 人面只挂 Console。四件套走 RUP，不进 GitHub Release。
          shopt -s nullglob
          assets=(dist/dec-console-*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "没有 Console 产物可挂到 GitHub Release"
            exit 1
          fi
          gh release create "${VERSION}" \
            "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
