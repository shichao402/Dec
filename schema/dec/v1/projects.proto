syntax = "proto3";

package dec.v1;

option go_package = "github.com/shichao402/Dec/schema/dec/v1;decv1";

// Project 描述 Git Vault 顶层唯一可写单元（项目），保存在 <p>/dec.yaml。
//
// Wire format 示例（my-app/dec.yaml）：
//
//   name: my-app
//   title: My App
//   depends_on:
//     - shared-tools
//   ides:
//     - cursor
//   editor: code --wait
message Project {
  // 项目名与顶层目录名一致，强制小写 kebab-case。
  string name = 1;
  string title = 2;
  string description = 3;
  // 提供方组成：本项目的资产依赖哪些项目。被订阅方的 depends_on 闭包只装 public（ADR 0029）。
  // 它不是消费声明；工作区订阅只在 .dec/config.yaml 的 requires 里。
  // 改名前叫 requires，读旧字段时折叠进本字段。
  repeated string depends_on = 4 [json_name = "depends_on"];
  // 该项目默认 IDE 列表；本地 .dec/config.yaml 可覆盖。
  repeated string ides = 5;
  // 该项目默认交互式编辑器；本地可覆盖。
  string editor = 6;
  // 展示与推荐标签。当前可配置的只有 global（推荐作为 Global 资产导入本机）。
  repeated string tags = 7;
}
