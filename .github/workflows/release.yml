name: Release

# 发布与部署（需求 21）。
#
# 一个 tag 走完全程：交叉编译 → 发布清单 → GitHub Release → 部署到服务器。
#
# 三条硬约束来自需求，改动这个文件前先看：
#
#   1. 所有平台的二进制都在 Linux runner 上用 Go 交叉编译（需求 21.1）。
#      免费套餐下私有仓库额度有限，macOS/Windows runner 的分钟数分别按
#      10 倍和 2 倍计算，用它们构建纯属浪费。
#   2. 部署只在 refs/tags/v* 上运行（需求 21.7）。免费套餐没有 environment
#      保护规则，这条是本仓库唯一能拦“非 tag 触发部署”的闸门。
#   3. 协议版本变了而要求版本没变时构建失败（需求 19.2）。反过来说，
#      只改服务端时可以显式沿用上一个要求版本，不必让所有设备跟着升级。

on:
  push:
    tags:
      - "v*"

# 同一时刻只允许一次发布在跑：两次并发部署会互相覆盖快照。
concurrency:
  group: dec-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod
  # go.work 指向本地 ../relkit，CI 上没有这个目录；关掉 workspace 用单模块构建。
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  build:
    name: 构建与发布
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      required: ${{ steps.meta.outputs.required }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史来比较上一个 tag 与 HEAD 的差异，判断客户端有没有改动。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验 tag 格式
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag 必须形如 v1.2.3，实际 $tag" >&2
            exit 1
          fi

      - name: 计算版本与要求版本
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          commit="$(git rev-parse HEAD)"
          proto="$(grep -E '^const Version = ' internal/proto/proto.go | grep -oE '[0-9]+')"
          test -n "$proto"

          # 上一个 release tag（按语义版本排序里最接近的那个）。
          prev_tag="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)"

          required="$tag"
          prev_required=""
          prev_proto=""
          if [ -n "$prev_tag" ]; then
            # 上一个发布清单是协议版本与要求版本的唯一可信来源：
            # 它是当时实际部署的内容，比仓库里的任何文件都准。
            if gh release download "$prev_tag" --pattern release.json --dir "$RUNNER_TEMP/prev" 2>/dev/null; then
              prev_proto="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("protocol",""))' "$RUNNER_TEMP/prev/release.json")"
              prev_required="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("required_client",""))' "$RUNNER_TEMP/prev/release.json")"
            fi
          fi

          # 客户端没改动就沿用上一个要求版本（需求 19.2）：
          # 只修服务端时不该让所有设备都去下载一遍。
          if [ -n "$prev_tag" ] && [ -n "$prev_required" ]; then
            if git diff --quiet "$prev_tag"..HEAD -- cmd/dec-agent internal/agent internal/proto; then
              required="$prev_required"
              echo "客户端无改动，沿用要求版本 $required"
            fi
          fi

          # 协议变了却没人升级要求版本，等于把不兼容的变更悄悄推给旧代理。
          if [ -n "$prev_proto" ] && [ "$prev_proto" != "$proto" ] && [ "$required" = "$prev_required" ]; then
            echo "协议版本从 $prev_proto 变为 $proto，但要求版本仍是 $required；请提升版本或修正协议" >&2
            exit 1
          fi

          # 要求版本不得倒退。
          # 「客户端无改动就沿用上一个要求版本」是常态，但如果这次 tag 本身比上一个
          # 要求版本更新，沿用就会得到更旧的要求版本——被版本对齐拦下的设备会
          # 一直停在旧要求上。2026-10 的真实情况：v2.0.2 之后连续几次发布都在
          # 沿用 v2.0.2，required_client 始终没有随版本前进。
          if [ -n "$prev_required" ] && [ "$(printf '%s\n%s\n' "$prev_required" "$required" | sort -V | head -n1)" = "$required" ] \
             && [ "$required" != "$prev_required" ]; then
            echo "要求版本倒退：上一个 ${prev_required}，本次 ${required}" >&2
            exit 1
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "protocol=$proto" >> "$GITHUB_OUTPUT"
          echo "版本 $tag，要求代理版本 $required，协议 $proto，commit $commit"

      - name: 测试
        run: go test ./...

      - name: 交叉编译
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.Version=$VERSION -X main.BuildTime=$built_at"
          mkdir -p dist

          # 服务端只有 Linux：它就跑在那一台机器上。
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" \
              -o "dist/dec-cloud-linux-$arch" ./cmd/dec-cloud
          done

          # 客户端覆盖日常会用到的平台组合（需求 2.9 的通用二进制）。
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%%/*}"
            arch="${target##*/}"
            out="dist/dec-agent-$os-$arch"
            if [ "$os" = "windows" ]; then
              out="$out.exe"
            fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" \
              -o "$out" ./cmd/dec-agent
          done

          ls -l dist

      - name: 生成发布清单
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REQUIRED: ${{ steps.meta.outputs.required }}
          PROTOCOL: ${{ steps.meta.outputs.protocol }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          dist = pathlib.Path("dist")
          files = []
          for p in sorted(dist.iterdir()):
              if not p.is_file() or p.name == "release.json":
                  continue
              stem = p.name
              if stem.endswith(".exe"):
                  stem = stem[:-4]
              # dec-agent-<os>-<arch>
              _, kind, os_name, arch = stem.split("-", 3)
              data = p.read_bytes()
              files.append({
                  "name": p.name,
                  "os": os_name,
                  "arch": arch,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              })

          # 下载通道只列客户端：服务端二进制不该出现在公网下载页上。
          files = [f for f in files if f["name"].startswith("dec-agent-")]
          manifest = {
              "version": os.environ["VERSION"],
              "required_client": os.environ["REQUIRED"],
              "protocol": int(os.environ["PROTOCOL"]),
              "built_at": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "files": files,
          }
          pathlib.Path("dist/release.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          REQUIRED: ${{ steps.meta.outputs.required }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo "版本 \`$VERSION\`"
            echo
            echo "- 要求代理版本：\`$REQUIRED\`"
            echo "- commit：\`$COMMIT\`"
            echo
            echo "部署由本工作流自动完成；下载通道以服务端 \`/download\` 为准。"
          } > notes.md
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --notes-file notes.md \
            --verify-tag

  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-latest
    # 需求 21.7：免费套餐没有 environment 保护规则，这条 if 是唯一的调用范围限制。
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 取回发布产物
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$VERSION" --pattern '*' --dir dist
          ls -l dist

      - name: 组装部署包
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REQUIRED: ${{ needs.build.outputs.required }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p payload
          cp dist/dec-cloud-linux-amd64 payload/dec-cloud
          cp dist/release.json payload/release.json
          # 客户端二进制随服务端一起上传（需求 20.2）：服务端不主动去外部拉取。
          mkdir -p payload/download
          cp dist/dec-agent-* payload/download/

          python3 - "$VERSION" "$REQUIRED" "$COMMIT" <<'PY'
          import json, os, sys
          version, required, commit = sys.argv[1:4]
          json.dump(
              {"version": version, "required": required, "commit": commit,
               "tag": version},
              open("payload/args.json", "w"),
              ensure_ascii=False, indent=2,
          )
          PY

          tar -C payload -cf payload.tar .
          ls -l payload.tar

      - name: 配置 SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "缺少 DEPLOY_SSH_KEY" >&2; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "缺少 DEPLOY_KNOWN_HOSTS" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 预置 host key（需求 21.6）：绝不自动接受未知的 host key。
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 执行部署
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "缺少 DEPLOY_HOST" >&2; exit 1; }
          user="${DEPLOY_USER:-deploy}"
          # 部署入口由 authorized_keys 的 command= 强制指定（需求 21.6），
          # 这里的命令只是一个占位；参数与产物全部走 stdin 的 tar 流，
          # 因此没有任何可以注入的位置。
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              "$user@$DEPLOY_HOST" deploy < payload.tar
