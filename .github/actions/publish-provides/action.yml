name: Publish Dec provides
description: Publish a provider repository's declared Dec assets to the official registry

inputs:
  project-root:
    description: Provider repository root
    required: true
  ref:
    description: Immutable provider version, for example v0.4.3
    required: true
  registry-url:
    description: Override the Dec registry Git URL
    required: false
    default: ""
  registry-ssh-key:
    description: Writable deploy key for the Dec registry repository
    required: false
    default: ""
  registry-token:
    description: Writable HTTPS token for the Dec registry repository
    required: false
    default: ""
  dec-version:
    description: Dec GitHub Release version containing dec-registry
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Go for source fallback
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../../../go.mod
        cache: false

    - name: Download or build dec-registry and publish
      shell: bash
      env:
        INPUT_PROJECT_ROOT: ${{ inputs.project-root }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_REGISTRY_URL: ${{ inputs.registry-url }}
        INPUT_SSH_KEY: ${{ inputs.registry-ssh-key }}
        DEC_REGISTRY_TOKEN: ${{ inputs.registry-token }}
        INPUT_DEC_VERSION: ${{ inputs.dec-version }}
      run: |
        set -euo pipefail

        if [ -z "$INPUT_SSH_KEY" ] && [ -z "$DEC_REGISTRY_TOKEN" ]; then
          echo "registry-ssh-key 或 registry-token 至少需要一个" >&2
          exit 1
        fi

        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) platform=linux-amd64 ;;
          Windows/X64) platform=windows-amd64.exe ;;
          macOS/X64) platform=darwin-amd64 ;;
          *)
            echo "不支持的 runner: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        version="$INPUT_DEC_VERSION"
        if [ -z "$version" ]; then
          version="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["GITHUB_ACTION_PATH"], "../../../version.json")))["version"])')"
        fi

        tool_dir="$RUNNER_TEMP/dec-registry-tool"
        rm -rf "$tool_dir"
        mkdir -p "$tool_dir"
        binary="$tool_dir/dec-registry"
        asset="dec-registry-${platform}"
        url="https://github.com/shichao402/Dec/releases/download/${version}/${asset}"

        if ! curl --proto '=https' --tlsv1.2 --retry 3 --location --silent --show-error --fail "$url" -o "$binary"; then
          echo "${asset} 未附在 Dec ${version}，从同一 Action ref 的源码构建"
          go build -C "$GITHUB_ACTION_PATH/../../.." -trimpath -o "$binary" ./cmd/dec-registry
        fi
        chmod +x "$binary"

        registry_url="$INPUT_REGISTRY_URL"
        key_file=""
        cleanup() {
          if [ -n "$key_file" ]; then
            rm -f "$key_file"
          fi
        }
        trap cleanup EXIT

        if [ -n "$INPUT_SSH_KEY" ]; then
          key_file="$RUNNER_TEMP/dec-registry-deploy-key"
          umask 077
          printf '%s\n' "$INPUT_SSH_KEY" > "$key_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          if [ -z "$registry_url" ]; then
            registry_url="git@github.com:shichao402/Dec.git"
          fi
        fi

        args=(publish-provides --project-root "$INPUT_PROJECT_ROOT" --ref "$INPUT_REF")
        if [ -n "$registry_url" ]; then
          args+=(--registry-url "$registry_url")
        fi
        "$binary" "${args[@]}"
