name: policy-probe

# 临时探测：验证 production environment 的部署分支策略是否真的会拦住
# 非 v* 标签的引用。验证完即删除，不进入常态。

on:
  workflow_dispatch:

jobs:
  probe:
    name: 探测 environment 策略
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 走到这里说明策略没有拦住
        run: echo "REACHED: production environment 未拦截本次引用"
