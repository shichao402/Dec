name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - "version.json"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from version.json
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::无效版本号格式: ${VERSION}，期望格式为 vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Ensure tag does not already exist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            echo "::error::Tag ${VERSION} 已存在，请先修改 version.json"
            exit 1
          fi

  test:
    name: Test
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Checkout relkit (SDK dependency)
        uses: actions/checkout@v5
        with:
          repository: shichao402/relkit
          path: ../relkit

      - name: Run tests
        run: go test ./... -v

      - name: Run integration tests (PTY)
        run: go test -tags=integration ./internal/tui/... -v

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: [test, validate]
    if: ${{ needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Checkout relkit (SDK dependency)
        uses: actions/checkout@v5
        with:
          repository: shichao402/relkit
          path: ../relkit

      - name: Use validated version
        id: version
        run: |
          echo "version=${{ needs.validate.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUTPUT="dec-${GOOS}-${GOARCH}${EXT}"
          # CGO_ENABLED=0 确保产物为纯静态二进制，不依赖构建机 glibc（避免在老 Linux 上报 GLIBC_2.3x not found）
          go build -ldflags "-X main.Version=${{ steps.version.outputs.version }} -X main.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S')" -o "$OUTPUT" .
          echo "artifact=${OUTPUT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dec-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.artifact }}

  rup-publish:
    name: RUP stage + publish (COS via agent)
    needs: [build, validate]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip when agent token missing
        id: gate
        env:
          RELKIT_AGENT_TOKEN: ${{ secrets.RELKIT_AGENT_TOKEN }}
        run: |
          if [ -z "${RELKIT_AGENT_TOKEN}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "RELKIT_AGENT_TOKEN not set; skipping RUP publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'

      - name: Set up Go
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Checkout relkit
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          repository: shichao402/relkit
          path: ../relkit

      - name: Build relkit CLI
        if: steps.gate.outputs.skip != 'true'
        working-directory: ../relkit
        run: go build -o "$GITHUB_WORKSPACE/relkit" ./cmd/relkit

      - name: Download all build artifacts
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Stage release tree
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          ADD_ARGS=()
          for f in dist/dec-*; do
            base=$(basename "$f")
            case "$base" in
              dec-linux-amd64) os=linux; arch=amd64 ;;
              dec-linux-arm64) os=linux; arch=arm64 ;;
              dec-darwin-amd64) os=darwin; arch=amd64 ;;
              dec-darwin-arm64) os=darwin; arch=arm64 ;;
              dec-windows-amd64.exe) os=windows; arch=amd64 ;;
              *) continue ;;
            esac
            ADD_ARGS+=(--add "$f" "id=$base,kind=binary,os=$os,arch=$arch")
          done
          CODE=$(python3 -c "maj,min,pat='${VER}'.split('.'); print(int(maj)*1000000+int(min)*1000+int(pat))")
          ./relkit stage "$VER" --code "$CODE" "${ADD_ARGS[@]}"

      - name: Pack staged tree
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          VER="${VERSION#v}"
          tar -C ".relkit/staged/${VER}" -czf staged.tar.gz .

      - name: Upload staged + trigger publish
        if: steps.gate.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELKIT_AGENT_TOKEN: ${{ secrets.RELKIT_AGENT_TOKEN }}
          RELKIT_AGENT_URL: ${{ secrets.RELKIT_AGENT_URL }}
        run: |
          set -euo pipefail
          VER="${VERSION#v}"
          AGENT_URL="${RELKIT_AGENT_URL:-https://publish.firoyang.com}"
          SHA=$(sha256sum staged.tar.gz | awk '{print $1}')
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${RELKIT_AGENT_TOKEN}" \
            --data-binary @staged.tar.gz \
            "${AGENT_URL}/v1/staged/dec/${VER}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RELKIT_AGENT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"product\":\"dec\",\"version\":\"${VER}\",\"stagedSha256\":\"${SHA}\",\"idempotencyKey\":\"dec/${VER}/${SHA}\"}" \
            "${AGENT_URL}/v1/publish"

  release:
    name: Release
    needs: [build, validate]
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create git tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          files: dist/*
          generate_release_notes: true

      - name: Sync ReleaseLatest branch
        run: |
          git push origin HEAD:refs/heads/ReleaseLatest --force
