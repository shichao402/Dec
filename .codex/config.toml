[mcp_servers.dec-pkv-mcp]
command = "pkv"
args = ["mcp"]
enabled = true

[mcp_servers.dec-pkv-mcp.env]
PKV_WORKSPACE_ROOT = "${workspaceFolder}"


[mcp_servers.dec-tencent-cloud]
command = "mise"
args = ["exec","node@20","--","node","${workspaceFolder}/.dec/cache/tencent-cloud/skills/tencent-cloud/server/dist/index.js"]
enabled = true


[mcp_servers.dec-vikunja-mcp]
command = "mise"
args = ["exec","node@20","--","npx","-y","@shichao402/vikunja-mcp"]
env_vars = ["VIKUNJA_API_TOKEN","VIKUNJA_URL"]
enabled = true
