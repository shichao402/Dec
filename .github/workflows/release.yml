name: Release

# 发布与部署（需求 21）。
#
# 一个 tag 走完全程：交叉编译 → 发布清单 → GitHub Release → 部署到服务器。
#
# 三条硬约束来自需求，改动这个文件前先看：
#
#   1. 所有平台的二进制都在 Linux runner 上用 Go 交叉编译（需求 21.1）。
#      免费套餐下私有仓库额度有限，macOS/Windows runner 的分钟数分别按
#      10 倍和 2 倍计算，用它们构建纯属浪费。
#   2. 部署只在 refs/tags/v* 上运行（需求 21.7）。免费套餐没有 environment
#      保护规则，这条是本仓库唯一能拦“非 tag 触发部署”的闸门。
#   3. 协议版本变了而要求版本没变时构建失败（需求 19.2）。反过来说，
#      只改服务端时可以显式沿用上一个要求版本，不必让所有设备跟着升级。

on:
  push:
    tags:
      - "v*"

# 同一时刻只允许一次发布在跑：两次并发部署会互相覆盖快照。
concurrency:
  group: dec-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GOFLAGS: -mod=mod
  # go.work 指向本地 ../relkit，CI 上没有这个目录；关掉 workspace 用单模块构建。
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  # macOS 托盘是唯一一个必须在 macOS 上构建的产物，这是对需求 21.1
  # 「SHALL NOT 使用 macOS runner」的一处有意例外，原因无法回避：
  # 托盘链接 AppKit，Linux runner 上没有 macOS SDK，Go 的交叉编译在这里帮不上忙。
  #
  # 该例外只覆盖 dec-tray，其余全部产物（服务端、代理）仍由 Linux runner
  # 交叉编译；job 内只做 Rust 构建，不开服务、不部署，缓存命中后约 2–3 分钟。
  # 需求 7.3 要求下载通道提供 macOS 产物时也必须提供同平台托盘，
  # 两条约束不能同时满足，取舍以「用户能真正用上」为准。
  tray-macos:
    name: 构建 macOS 托盘
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: 缓存托盘构建
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tray/target
          key: tray-macos-${{ hashFiles('tray/Cargo.lock') }}

      - name: 构建 macOS 托盘
        env:
          # 版本号来自 tag：与 dec-agent 同源（需求 7.3）。
          DEC_TRAY_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd tray
          cargo test --locked -q
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked --release --target "$arch"
          done
          cd ..
          cp tray/target/aarch64-apple-darwin/release/dec-tray dist/dec-tray-darwin-arm64
          cp tray/target/x86_64-apple-darwin/release/dec-tray dist/dec-tray-darwin-amd64
          file dist/dec-tray-darwin-*

      - name: 上传托盘产物到草稿 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 为什么不走 upload-artifact：
          # 私有仓库的 artifact 存储与 Actions 分钟数共享免费额度，一旦被历史
          # 中间产物占满，连一个 200 KB 的托盘都传不上去，整个发布链卡死，而且
          # 用量要 6–12 小时才重算，等不到。Release 附件属于另一套配额，且这些
          # 二进制本来就是要进 Release 的，等于省掉一次搬运。
          #
          # 用草稿状态：此刻只有托盘的半成品，不能让下载页看到一个不完整的版本。
          # build job 会把其余产物补齐，最后一步再把草稿转正。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/dec-tray-darwin-* --clobber
          else
            gh release create "$TAG" dist/dec-tray-darwin-* \
              --draft \
              --title "$TAG" \
              --notes "构建中，由 release.yml 自动发布，请勿手改。"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'

  build:
    name: 构建与发布
    needs: tray-macos
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      required: ${{ steps.meta.outputs.required }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史来比较上一个 tag 与 HEAD 的差异，判断客户端有没有改动。
          fetch-depth: 0
          # actions/checkout 默认不拉 tag。少了它有两处会静默出错：
          # 「上一个发布 tag」查不到，required 就退化成当前 tag；
          # 守卫测试会因为看不到 legacy-final 而误报标签丢失。
          fetch-tags: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验 tag 格式
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag 必须形如 v1.2.3，实际 $tag" >&2
            exit 1
          fi

      - name: 计算版本与要求版本
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          commit="$(git rev-parse HEAD)"
          proto="$(grep -E '^const Version = ' internal/proto/proto.go | grep -oE '[0-9]+')"
          test -n "$proto"

          # 上一个 release tag（按语义版本排序里最接近的那个）。
          prev_tag="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -n1 || true)"

          required="$tag"
          prev_required=""
          prev_proto=""
          if [ -n "$prev_tag" ]; then
            # 上一个发布清单是协议版本与要求版本的唯一可信来源：
            # 它是当时实际部署的内容，比仓库里的任何文件都准。
            if gh release download "$prev_tag" --pattern release.json --dir "$RUNNER_TEMP/prev" 2>/dev/null; then
              prev_proto="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("protocol",""))' "$RUNNER_TEMP/prev/release.json")"
              prev_required="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1])).get("required_client",""))' "$RUNNER_TEMP/prev/release.json")"
            fi
          fi

          # 客户端没改动就沿用上一个要求版本（需求 19.2）：
          # 只修服务端时不该让所有设备都去下载一遍。
          if [ -n "$prev_tag" ] && [ -n "$prev_required" ]; then
            if git diff --quiet "$prev_tag"..HEAD -- cmd/dec-agent internal/agent internal/proto; then
              required="$prev_required"
              echo "客户端无改动，沿用要求版本 $required"
            fi
          fi

          # 协议变了却没人升级要求版本，等于把不兼容的变更悄悄推给旧代理。
          if [ -n "$prev_proto" ] && [ "$prev_proto" != "$proto" ] && [ "$required" = "$prev_required" ]; then
            echo "协议版本从 $prev_proto 变为 $proto，但要求版本仍是 $required；请提升版本或修正协议" >&2
            exit 1
          fi

          # 要求版本不得倒退。
          # 「客户端无改动就沿用上一个要求版本」是常态，但如果这次 tag 本身比上一个
          # 要求版本更新，沿用就会得到更旧的要求版本——被版本对齐拦下的设备会
          # 一直停在旧要求上。2026-10 的真实情况：v2.0.2 之后连续几次发布都在
          # 沿用 v2.0.2，required_client 始终没有随版本前进。
          if [ -n "$prev_required" ] && [ "$(printf '%s\n%s\n' "$prev_required" "$required" | sort -V | head -n1)" = "$required" ] \
             && [ "$required" != "$prev_required" ]; then
            echo "要求版本倒退：上一个 ${prev_required}，本次 ${required}" >&2
            exit 1
          fi

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "protocol=$proto" >> "$GITHUB_OUTPUT"
          echo "版本 $tag，要求代理版本 $required，协议 $proto，commit $commit"

      - name: 测试
        run: go test ./...

      # macOS 托盘在独立 job 里构建（原因见 tray-macos job 的注释），
      # 这里取回后与 Windows 托盘一起进入发布清单与下载通道。
      # 走 Release 附件而不是 artifact：理由见 tray-macos job 的上传步骤。
      - name: 取回 macOS 托盘
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$VERSION" --pattern 'dec-tray-darwin-*' --dir dist
          ls -l dist/dec-tray-darwin-*

      - name: 交叉编译
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.Version=$VERSION -X main.BuildTime=$built_at"
          mkdir -p dist

          # 服务端只有 Linux：它就跑在那一台机器上。
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" \
              -o "dist/dec-cloud-linux-$arch" ./cmd/dec-cloud
          done

          # 客户端覆盖日常会用到的平台组合（需求 2.9 的通用二进制）。
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%%/*}"
            arch="${target##*/}"
            out="dist/dec-agent-$os-$arch"
            if [ "$os" = "windows" ]; then
              out="$out.exe"
            fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$ldflags" \
              -o "$out" ./cmd/dec-agent
          done

          ls -l dist

      # 托盘 dec-tray 是 Rust 工程（tray/），与 dec-agent 同一 tag（agent-tray-access 需求 7.3）。
      # Windows 版用 mingw 在 Linux 上交叉编译，不需要 Windows runner（需求 21.1）。
      # 只出 amd64：Windows on ARM 能以仿真方式运行 x64 程序，托盘不值得多一条工具链。
      - name: 缓存托盘构建
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tray/target
          key: tray-win-${{ hashFiles('tray/Cargo.lock') }}

      - name: 构建 Windows 托盘
        env:
          DEC_TRAY_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64
          rustup target add x86_64-pc-windows-gnu
          (cd tray && cargo test --locked -q && cargo build --locked --release --target x86_64-pc-windows-gnu)
          cp tray/target/x86_64-pc-windows-gnu/release/dec-tray.exe dist/dec-tray-windows-amd64.exe
          ls -l dist/dec-tray-*

      - name: 生成发布清单
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          REQUIRED: ${{ steps.meta.outputs.required }}
          PROTOCOL: ${{ steps.meta.outputs.protocol }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib

          dist = pathlib.Path("dist")
          files = []
          for p in sorted(dist.iterdir()):
              if not p.is_file() or p.name == "release.json":
                  continue
              stem = p.name
              if stem.endswith(".exe"):
                  stem = stem[:-4]
              # dec-agent-<os>-<arch>
              _, kind, os_name, arch = stem.split("-", 3)
              data = p.read_bytes()
              files.append({
                  "name": p.name,
                  "os": os_name,
                  "arch": arch,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              })

          # 下载通道只列客户端（代理与托盘）：服务端二进制不该出现在公网下载页上。
          files = [f for f in files if f["name"].startswith(("dec-agent-", "dec-tray-"))]
          manifest = {
              "version": os.environ["VERSION"],
              "required_client": os.environ["REQUIRED"],
              "protocol": int(os.environ["PROTOCOL"]),
              "built_at": __import__("datetime").datetime.now(
                  __import__("datetime").timezone.utc
              ).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "files": files,
          }
          pathlib.Path("dist/release.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          REQUIRED: ${{ steps.meta.outputs.required }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo "版本 \`$VERSION\`"
            echo
            echo "- 要求代理版本：\`$REQUIRED\`"
            echo "- commit：\`$COMMIT\`"
            echo
            echo "部署由本工作流自动完成；下载通道以服务端 \`/download\` 为准。"
          } > notes.md
          # 托盘产物在 tray-macos job 里建成了草稿 Release，这里把其余产物补上
          # 再转正。若草稿不存在（比如托盘 job 被跳过），退回直接创建。
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
            gh release edit "$VERSION" --draft=false --notes-file notes.md
          else
            gh release create "$VERSION" dist/* \
              --title "$VERSION" \
              --notes-file notes.md \
              --verify-tag
          fi
          gh release view "$VERSION" --json isDraft,assets --jq '{draft: .isDraft, assets: [.assets[].name]}'

  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-latest
    # 需求 21.7：免费套餐没有 environment 保护规则，这条 if 是唯一的调用范围限制。
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 取回发布产物
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$VERSION" --pattern '*' --dir dist
          ls -l dist

      - name: 组装部署包
        env:
          VERSION: ${{ needs.build.outputs.version }}
          REQUIRED: ${{ needs.build.outputs.required }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p payload
          cp dist/dec-cloud-linux-amd64 payload/dec-cloud
          cp dist/release.json payload/release.json
          # 客户端二进制随服务端一起上传（需求 20.2）：服务端不主动去外部拉取。
          mkdir -p payload/download
          cp dist/dec-agent-* payload/download/
          cp dist/dec-tray-* payload/download/ 2>/dev/null || echo "本次发布没有托盘产物"

          python3 - "$VERSION" "$REQUIRED" "$COMMIT" <<'PY'
          import json, os, sys
          version, required, commit = sys.argv[1:4]
          json.dump(
              {"version": version, "required": required, "commit": commit,
               "tag": version},
              open("payload/args.json", "w"),
              ensure_ascii=False, indent=2,
          )
          PY

          tar -C payload -cf payload.tar .
          ls -l payload.tar

      - name: 配置 SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" || { echo "缺少 DEPLOY_SSH_KEY" >&2; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "缺少 DEPLOY_KNOWN_HOSTS" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 预置 host key（需求 21.6）：绝不自动接受未知的 host key。
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 执行部署
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "缺少 DEPLOY_HOST" >&2; exit 1; }
          user="${DEPLOY_USER:-deploy}"
          # 部署入口由 authorized_keys 的 command= 强制指定（需求 21.6），
          # 这里的命令只是一个占位；参数与产物全部走 stdin 的 tar 流，
          # 因此没有任何可以注入的位置。
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              "$user@$DEPLOY_HOST" deploy < payload.tar
