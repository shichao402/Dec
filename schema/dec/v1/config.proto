syntax = "proto3";

package dec.v1;

option go_package = "github.com/shichao402/Dec/schema/dec/v1;decv1";

// GlobalConfig 对应 ~/.dec/config.yaml。
message GlobalConfig {
  string repo_url = 1 [json_name = "repo_url"];
  repeated string ides = 2;
  string editor = 3;
  // dec-server 在无门面连接后退出前的等待时长（Go duration，如 "30m"）。
  string server_idle_timeout = 4 [json_name = "server_idle_timeout"];
  // 改名前的本机启用项目名。只读兼容：加载时折叠为 requires{<名>: vault}，保存不写回（ADR 0029）。
  repeated string enabled_projects = 5 [json_name = "enabled_projects"];
  // Console 显式接管或扫描导入的目标设备项目目录。
  repeated ManagedProject managed_projects = 6 [json_name = "managed_projects"];
  // 一次 Bitwarden 解锁在本机的有效期（Go duration，如 "4h"）。
  string session_timeout = 7 [json_name = "session_timeout"];
  // 解锁有效期到点后，是否用进程内保留的主密码自动重新解锁。
  optional bool auto_reunlock_on_timeout = 8 [json_name = "auto_reunlock_on_timeout"];
  // Global 平面唯一的消费声明：项目名 → pin（latest / v* 走官方注册表，vault 走个人私仓）。
  map<string, string> requires = 9;
}

message ManagedProject {
  string root = 1;
  string label = 2;
}

// ProjectConfig 对应 <workspace>/.dec/config.yaml（version v2）。
message ProjectConfig {
  string version = 1;
  // 作者身份：本工作区创作私仓里的哪个项目（<project_name>/dec.yaml）。
  // 它不是订阅锚点，不出现在 requires 里（ADR 0029）。
  string project_name = 2 [json_name = "project_name"];
  // 机器级 IDE 覆盖（可选）；未设置时继承 vault Project.ides → 全局 ides。
  repeated string ides = 3;
  // 机器级 editor 覆盖（可选）。
  string editor = 4;
  reserved 5, 6, 7;
  reserved "available", "enabled", "enabled_bundles";
  // 单产品仓提供的资产；key 是稳定的本地声明 ID。与 products 互斥。
  map<string, ProjectProvide> provides = 8;
  // 单产品仓的作者目录基准点（相对仓根，新项目默认 DecAssets；旧项目空=仓库根）。
  // 与 products 互斥。
  string provides_root = 9 [json_name = "provides_root"];
  // 本工作区唯一的消费声明：项目名 → pin（latest / v* 走官方注册表，vault 走个人私仓）。
  // 改名前的 enabled_bundles 已 reserved，只在加载时折叠为 requires{<名>: vault}（ADR 0029）。
  map<string, string> requires = 10;
  // 一个产品仓里的多个产品。key 是产品名。与 project_name / provides_root / provides 互斥。
  map<string, ProductDecl> products = 11;
}

// ProductDecl 是产品仓中的一个产品。root 相对仓根；provides.source 相对 root。
message ProductDecl {
  string root = 1;
  map<string, ProjectProvide> provides = 2;
}

message ProjectProvide {
  // 单产品仓相对仓根；写在 ProductDecl 里时相对该产品的 root。
  string source = 1;
  string visibility = 2; // public | private
  string plane = 3; // global | local
  string type = 4; // skill | rule | mcp | command | secret
  string name = 5;
}
