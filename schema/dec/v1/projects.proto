syntax = "proto3";

package dec.v1;

option go_package = "github.com/shichao402/Dec/schema/dec/v1;decv1";

// Project 描述 Git Vault 顶层唯一可写单元 P，保存在 <p>/dec.yaml。
//
// Wire format 示例（my-app/dec.yaml）：
//
//   name: my-app
//   title: My App
//   requires:
//     - shared-tools
//   ides:
//     - cursor
//   editor: code --wait
message Project {
  // P 名与顶层目录名一致，强制小写 kebab-case。
  string name = 1;
  string title = 2;
  string description = 3;
  // 仅直接引用目标 P 的 public/project；不传递，private 永不被引用。
  repeated string requires = 4;
  // 该项目默认 IDE 列表；本地 .dec/config.yaml 可覆盖。
  repeated string ides = 5;
  // 该项目默认交互式编辑器；本地可覆盖。
  string editor = 6;
}
