# Dec 已迁到 CNB 主力。按 relkit 渠道 tag 发版：
#   git tag  dev/vX.Y.Z    && git push origin  dev/vX.Y.Z     → RUP channel=dev
#   git tag  stable/vX.Y.Z && git push origin  stable/vX.Y.Z  → RUP channel=stable
# 推送前请先把 version.json 改成对应 vX.Y.Z 并推到 main。
# GitHub 仅作镜像（cnb-bridge 定时 CNB→GitHub）。
# 密钥：shichao402/keystores (KeyStore) 的 relkit_release.env.yml
#   RELKIT_PUBLISH_TOKEN / RELKIT_PUBLISH_URL（默认 https://publish.firoyang.com）

.release: &release
  name: release
  docker:
    image: golang:1.26
  imports:
    - https://cnb.cool/shichao402/keystores/-/blob/main/relkit_release.env.yml
  stages:
    - name: setup
      script: |
        set -euo pipefail
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates curl python3 tar
        git fetch --tags --prune || true

        TAG="${CNB_BRANCH:-}"
        case "$TAG" in
          dev/*)
            CHANNEL=dev
            VERSION="${TAG#dev/}"
            ;;
          stable/*)
            CHANNEL=stable
            VERSION="${TAG#stable/}"
            ;;
          *)
            # web_trigger / 手动：从 version.json 取版本，默认进 dev
            CHANNEL="${RELEASE_CHANNEL:-dev}"
            VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
            echo "非渠道 tag 触发（branch/tag=$TAG），使用 version.json=$VERSION channel=$CHANNEL"
            ;;
        esac

        if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "无效版本号: $VERSION（期望 vMAJOR.MINOR.PATCH）"
          exit 1
        fi
        if [[ "$CHANNEL" != "dev" && "$CHANNEL" != "stable" ]]; then
          echo "无效渠道: $CHANNEL（期望 dev 或 stable）"
          exit 1
        fi

        FILE_VER=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
        if [ "$FILE_VER" != "$VERSION" ]; then
          echo "version.json ($FILE_VER) 与发布版本 ($VERSION) 不一致"
          exit 1
        fi

        echo "$VERSION" > .release-version
        echo "$CHANNEL" > .release-channel
        echo "version=$VERSION channel=$CHANNEL tag=$TAG"

        # 钉住已验证的 relkit commit，勿漂到 main HEAD。
        python3 scripts/ensure_relkit_sparse.py --sdk-only --ref 6c78d29fbd54efa87e6adf189fb9b7b277accd7c

    - name: test
      script: |
        set -euo pipefail
        go test ./... -v

    - name: build
      script: |
        set -euo pipefail
        VERSION=$(cat .release-version)
        export VERSION
        CONSOLE_VERSION="${VERSION#v}"
        export CONSOLE_VERSION
        python3 - <<'PY'
        import json, os, pathlib, re
        version = os.environ["CONSOLE_VERSION"]
        cargo = pathlib.Path("client/src-tauri/Cargo.toml")
        cargo.write_text(re.sub(r'(?m)^(version = ")[^"]+(")$', rf'\g<1>{version}\2', cargo.read_text(), count=1))
        conf = pathlib.Path("client/src-tauri/tauri.conf.json")
        data = json.loads(conf.read_text())
        data["version"] = version
        conf.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
        PY
        bash scripts/build.sh --all

    - name: build-linux-console
      script: |
        set -euo pipefail
        # CNB 默认云节点是 Linux/amd64：这里原生构建用户可下载的 AppImage。
        # Windows NSIS / macOS DMG 不能在 Linux Docker 中可靠交叉构建，后续需原生节点。
        apt-get install -y --no-install-recommends \
          build-essential curl file libayatana-appindicator3-dev librsvg2-dev \
          libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf wget
        if ! command -v node >/dev/null || [ "$(node -p 'Number(process.versions.node.split(`.`)[0])')" -lt 20 ]; then
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y --no-install-recommends nodejs
        fi
        if ! command -v cargo >/dev/null; then
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
        fi
        . "$HOME/.cargo/env"
        python3 scripts/build-console.py

    - name: checksums
      script: |
        set -euo pipefail
        # 产物摘要写进 version.json，供 install.sh 校验（ADR 0019）。
        # 必须在 build 之后：摘要来自实际产物，不能预先写死。
        python3 scripts/gen_checksums.py dist version.json
        cp version.json dist/dec-runtime-manifest.json

    - name: rup-publish
      script: |
        set -euo pipefail
        VERSION=$(cat .release-version)
        CHANNEL=$(cat .release-channel)
        VER="${VERSION#v}"
        if [ -z "${RELKIT_PUBLISH_TOKEN:-}" ]; then
          echo "RELKIT_PUBLISH_TOKEN 未配置，跳过 RUP 发布"
          exit 0
        fi
        ( cd third_party/relkit && go build -o "$OLDPWD/relkit-bin" ./cmd/relkit )
        # 不用 bash 数组：部分 runner 以 sh 执行 script，ADD_ARGS=() 会直接语法失败。
        CODE=$(python3 -c "maj,min,pat='${VER}'.split('.'); print(int(maj)*1000000+int(min)*1000+int(pat))")
        set -- stage "$VER" --code "$CODE" --channel "$CHANNEL"
        for f in dist/dec-*; do
          [ -f "$f" ] || continue
          base=$(basename "$f")
          case "$base" in
            *-linux-amd64) os=linux; arch=amd64 ;;
            *-linux-arm64) os=linux; arch=arm64 ;;
            *-darwin-amd64) os=darwin; arch=amd64 ;;
            *-darwin-arm64) os=darwin; arch=arm64 ;;
            *-windows-amd64.exe) os=windows; arch=amd64 ;;
            *) continue ;;
          esac
          component="${base%-${os}-${arch}*}"
          set -- "$@" --add "$f" "id=$base,kind=binary,os=$os,arch=$arch,component=$component,audience=runtime"
        done
        set -- "$@" --add "dist/dec-runtime-manifest.json" \
          "id=dec-runtime-manifest,filename=dec-runtime-manifest.json,kind=blob,component=manifest,audience=runtime"
        # GUI 由对应原生构建节点产出并归一化到 dist/dec-console-<os>-<arch>.<ext>。
        # 一旦存在 audience=user 产物，人类发布页只展示这些 GUI；四件套仍留在签名协议清单。
        for f in dist/dec-console-*; do
          [ -f "$f" ] || continue
          base=$(basename "$f")
          case "$base" in
            dec-console-linux-amd64.*) os=linux; arch=amd64 ;;
            dec-console-linux-arm64.*) os=linux; arch=arm64 ;;
            dec-console-darwin-amd64.*) os=darwin; arch=amd64 ;;
            dec-console-darwin-arm64.*) os=darwin; arch=arm64 ;;
            dec-console-windows-amd64.*) os=windows; arch=amd64 ;;
            *) continue ;;
          esac
          set -- "$@" --add "$f" "id=dec-console-${os}-${arch},os=$os,arch=$arch,component=console,audience=user"
        done
        ./relkit-bin "$@"
        tar -C ".relkit/staged/${VER}" -czf staged.tar.gz .
        PUBLISH_URL="${RELKIT_PUBLISH_URL:-https://publish.firoyang.com}"
        SHA=$(sha256sum staged.tar.gz | awk '{print $1}')
        curl -fsS -X PUT \
          -H "Authorization: Bearer ${RELKIT_PUBLISH_TOKEN}" \
          --data-binary @staged.tar.gz \
          "${PUBLISH_URL}/v1/staged/dec/${VER}"
        curl -fsS -X POST \
          -H "Authorization: Bearer ${RELKIT_PUBLISH_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"product\":\"dec\",\"version\":\"${VER}\",\"stagedSha256\":\"${SHA}\",\"idempotencyKey\":\"dec/${CHANNEL}/${VER}/${SHA}\"}" \
          "${PUBLISH_URL}/v1/publish"

    - name: github-release
      script: |
        set -euo pipefail
        VERSION=$(cat .release-version)
        CHANNEL=$(cat .release-channel)
        if [ "$CHANNEL" != "stable" ]; then
          echo "channel=$CHANNEL，跳过 GitHub Release（仅 stable 推）"
          exit 0
        fi
        git config user.name "cnb-ci"
        git config user.email "cnb-ci@users.noreply.cnb.cool"
        # install.sh 从 main 取 version.json 校验摘要，故带 checksums 的
        # version.json 必须先提交到主干。
        if ! git diff --quiet -- version.json; then
          git add version.json
          git commit -m "chore: 发布 ${VERSION} 产物摘要"
        fi
        # 安装脚本与 GitHub Release 仍用裸版本 tag vX.Y.Z
        if ! git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"
        fi
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "GITHUB_TOKEN 未配置，跳过 GitHub Release（等日桥接同步 tag）"
          exit 0
        fi
        GH_VER=2.74.1
        curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VER}/gh_${GH_VER}_linux_amd64.tar.gz" | tar -xz
        export GH_TOKEN="$GITHUB_TOKEN"
        ./gh_${GH_VER}_linux_amd64/bin/gh release create "${VERSION}" \
          dist/dec-* \
          version.json \
          --repo shichao402/Dec \
          --generate-notes \
          --target "$(git rev-parse HEAD)"

"dev/*":
  tag_push:
    - <<: *release
      name: release-dev

"stable/*":
  tag_push:
    - <<: *release
      name: release-stable

main:
  web_trigger_release:
    - <<: *release
      name: release-now
