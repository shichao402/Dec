<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Dec favicon: cream plate, ring, five-leaf fan. Matches the app icon artwork. -->
  <rect width="64" height="64" rx="15" fill="#F1EDE2"/>
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="#26231C" stroke-width="3.2"/>
  <circle cx="32" cy="32" r="17.2" fill="none" stroke="#26231C" stroke-width="0.7" opacity="0.85"/>
  <g transform="translate(32 49.5)">
    <!-- outer leaves -->
    <path d="M0 0 C -3.8 -7.5, -4.2 -17, 0 -22 C 4.2 -17, 3.8 -7.5, 0 0 Z" fill="#26231C" transform="rotate(-54)"/>
    <path d="M0 0 C -3.8 -7.5, -4.2 -17, 0 -22 C 4.2 -17, 3.8 -7.5, 0 0 Z" fill="#26231C" transform="rotate(54)"/>
    <!-- inner leaves -->
    <path d="M0 0 C -4.2 -10, -4.5 -24, 0 -30 C 4.5 -24, 4.2 -10, 0 0 Z" fill="#26231C" transform="rotate(-30)"/>
    <path d="M0 0 C -4.2 -10, -4.5 -24, 0 -30 C 4.5 -24, 4.2 -10, 0 0 Z" fill="#26231C" transform="rotate(30)"/>
    <!-- centre leaf, outlined -->
    <path d="M0 0 C -4.5 -13, -4.8 -28, 0 -34 C 4.8 -28, 4.5 -13, 0 0 Z" fill="#F1EDE2" stroke="#26231C" stroke-width="1.7" stroke-linejoin="round"/>
  </g>
</svg>
