syntax = "proto3";

package service.v1;

option go_package = "github.com/shichao402/Dec/schema/gen/go/service/v1;servicev1";

// DecService 是本机唯一 dec-server 暴露给 TUI / MCP / 管理客户端的接口。
// 进程启动后全局锁定：仅 Ping 与 Authenticate 可在未解锁时调用。
service DecService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc KeepAlive(stream KeepAliveRequest) returns (stream KeepAliveResponse);
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc RunOperation(RunOperationRequest) returns (stream RunOperationResponse);
  rpc GetActiveOperation(GetActiveOperationRequest) returns (GetActiveOperationResponse);
  rpc WatchOperation(WatchOperationRequest) returns (stream WatchOperationResponse);
  // ADR 0036 凭据请求通道（阶段 B）：Agent 工具在操作中缺少凭据时，经服务挂起
  // 请求并唤起 Console；Console 用 PullCredentialRequest 拉取当前挂起请求的
  // 描述（不含秘密），渲染对应控件；用户填写后经 SubmitCredential 提交。
  // 秘密字段只在服务进程内存流转，不落盘、不进日志、不进 argv。
  rpc PullCredentialRequest(PullCredentialRequestRequest) returns (PullCredentialRequestResponse);
  rpc SubmitCredential(SubmitCredentialRequest) returns (SubmitCredentialResponse);
}

message PingRequest {}

message PingResponse {
  string version = 1;
  string instance_id = 2;
  bool unlocked = 3;
}

message AuthenticateRequest {
  string password = 1;
  string totp = 2;
  bool remember_device = 3;
  string email = 4;
  // retain_password 由 Console「保存主密码」勾选驱动：允许 dec-server 在进程内存
  // 保留主密码，会话超时或云端失效后自行静默重解锁。禁止落盘，进程退出即消失。
  bool retain_password = 5;
}

message AuthenticateResponse {
  bool unlocked = 1;
  bool need_2fa = 2;
  string control_token = 3;
  int64 expires_in_ms = 4;
  string error = 5;
}

message ShutdownRequest {
  string reason = 1;
}

message ShutdownResponse {
  bool accepted = 1;
}

message KeepAliveRequest {
  string client_id = 1;
  string facade = 2;
}

message KeepAliveResponse {
  int64 server_time_unix_ms = 1;
}

// Invoke 承载短操作。payload_json/result_json 使用现有 app DTO 的 JSON 表示，
// 避免服务拆分与业务 DTO 全量 protobuf 化互相阻塞。
message InvokeRequest {
  string method = 1;
  string project_root = 2;
  bytes payload_json = 3;
  int64 unlock_timeout_ms = 4; // 等待 Console Authenticate；0 使用服务默认值
  string workspace_plane = 5; // "local" | "global"；兼容 "project" | "user"
}

message InvokeResponse {
  bytes result_json = 1;
  repeated OperationEvent events = 2;
}

message RunOperationRequest {
  string operation = 1;
  string project_root = 2;
  string client_id = 3;
  string facade = 4;
  bytes payload_json = 5;
  int64 unlock_timeout_ms = 6; // 等待 Console Authenticate；0 使用服务默认值
  string workspace_plane = 7; // "local" | "global"；兼容 "project" | "user"
}

message GetActiveOperationRequest {
  string project_root = 1;
}

message WatchOperationRequest {
  string project_root = 1;
  string operation_id = 2;
}

message ActiveOperation {
  bool active = 1;
  string operation_id = 2;
  string operation = 3;
  string client_id = 4;
  string facade = 5;
  int64 started_at_unix_ms = 6;
}

message Progress {
  string phase = 1;
  int32 current = 2;
  int32 total = 3;
}

message OperationEvent {
  int64 time_unix_ms = 1;
  string level = 2;
  string scope = 3;
  string message = 4;
  Progress progress = 5;
}

message RunOperationResponse {
  string operation_id = 1;
  ActiveOperation active = 2;
  OperationEvent event = 3;
  bytes result_json = 4;
  string error = 5;
  bool done = 6;
}

message GetActiveOperationResponse {
  ActiveOperation operation = 1;
}

message WatchOperationResponse {
  string operation_id = 1;
  ActiveOperation active = 2;
  OperationEvent event = 3;
  bytes result_json = 4;
  string error = 5;
  bool done = 6;
}

// ---------- ADR 0036 凭据请求通道 ----------

// CredentialRequestKind 决定 Console 渲染哪种凭据控件。
enum CredentialRequestKind {
  CREDENTIAL_REQUEST_KIND_UNSPECIFIED = 0;
  // 登录密码（SSH 密码登录引导安装等）：单行密码输入框。
  CREDENTIAL_REQUEST_KIND_LOGIN_PASSWORD = 1;
  // 私钥口令：单行密码输入框（导入带 passphrase 的私钥时）。
  CREDENTIAL_REQUEST_KIND_KEY_PASSPHRASE = 2;
  // 私钥材料（存量导入）：私钥正文多行粘贴 + 公钥可选单行。
  CREDENTIAL_REQUEST_KIND_PRIVATE_KEY_MATERIAL = 3;
  // 危险动作确认：仅确认按钮，无输入框（如 rotate 触碰远端 authorized_keys）。
  CREDENTIAL_REQUEST_KIND_CONFIRM = 4;
}

message PullCredentialRequestRequest {}

message PullCredentialRequestResponse {
  bool pending = 1;
  string request_id = 2;
  CredentialRequestKind kind = 3;
  // 服务端生成的用户可读描述，如「为设备 dev-box 提供登录密码以安装 SSH 密钥」。
  string prompt = 4;
  // 来源操作名（dec_install_ssh_key 等），仅供 Console 展示。
  string operation = 5;
  string error = 6;
}

message SubmitCredentialRequest {
  string request_id = 1;
  // 秘密值（密码 / 口令 / 私钥正文）。仅内存流转。
  string secret = 2;
  // 私钥材料提交时的公钥（可选，服务端可自算校验）。
  string public_key = 3;
  // confirm 类请求的批准结果。
  bool approved = 4;
  // 用户在 Console 点「取消」：服务把 CANCELED 交还给等待方。
  bool canceled = 5;
}

message SubmitCredentialResponse {
  bool accepted = 1;
  string error = 2;
}
