syntax = "proto3";

package dec.v1;

option go_package = "github.com/shichao402/Dec/schema/dec/v1;decv1";

// GlobalConfig 对应 ~/.dec/config.yaml。
message GlobalConfig {
  string repo_url = 1 [json_name = "repo_url"];
  repeated string ides = 2;
  string editor = 3;
  // dec-server 在无门面连接后退出前的等待时长（Go duration，如 "30m"）。
  string server_idle_timeout = 4 [json_name = "server_idle_timeout"];
  // 用户平面启用的项目名；每项安装该项目的 public/user 与 private/user。
  repeated string enabled_projects = 5 [json_name = "enabled_projects"];
  // Console 显式接管或扫描导入的目标设备项目目录。
  repeated ManagedProject managed_projects = 6 [json_name = "managed_projects"];
  // 一次 Bitwarden 解锁在本机的有效期（Go duration，如 "4h"）。
  string session_timeout = 7 [json_name = "session_timeout"];
  // 解锁有效期到点后，是否用进程内保留的主密码自动重新解锁。
  optional bool auto_reunlock_on_timeout = 8 [json_name = "auto_reunlock_on_timeout"];
}

message ManagedProject {
  string root = 1;
  string label = 2;
}

// ProjectConfig 对应 <workspace>/.dec/config.yaml（version v2）。
// 本地配置以 project_name 绑定 Git Vault 顶层 <p>/dec.yaml。
message ProjectConfig {
  string version = 1;
  // 引用的 vault Project 名，对应 projects/<project_name>.yaml。
  string project_name = 2 [json_name = "project_name"];
  // 机器级 IDE 覆盖（可选）；未设置时继承 vault Project.ides → 全局 ides。
  repeated string ides = 3;
  // 机器级 editor 覆盖（可选）。
  string editor = 4;
  reserved 5, 6, 7;
  reserved "available", "enabled", "enabled_bundles";
}
