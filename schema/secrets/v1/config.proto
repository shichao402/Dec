syntax = "proto3";

package secrets.v1;

option go_package = "github.com/shichao402/Dec/schema/secrets/v1;secretsv1";

// SecretsConfig 描述 Bitwarden 连接与可选显式绑定。
// Pull 通常按 enabled Dec bundle + project_name 自动解析 SyncTarget；也可显式配置。
message SecretsConfig {
  // project 级 secrets 的 Bitwarden folder 名；未设时回退 project_name。
  string project_secrets = 1 [json_name = "project_secrets"];
  // 可选：Dec bundle ↔ Bitwarden folder 显式绑定（默认同名，一般不需要）。
  repeated BundleBinding bundles = 2;
}

// BundleBinding 描述 Dec bundle 与 Bitwarden folder 的可选别名绑定。
// Note 名 = 相对 SyncTarget.LocalRoot 的路径；落地在 .secrets/bundles/<name>/ 或 .secrets/project/。
message BundleBinding {
  // Dec Git Vault 中的 bundle 名（与 enabled_bundles 条目对应）。
  string dec_bundle_name = 1 [json_name = "dec_bundle"];
  // Bitwarden folder 名；默认同 dec_bundle_name（严格同名，无硬编码特例）。
  string secrets_bundle_name = 2 [json_name = "secrets_bundle"];
  // 3 曾是 target_dir（消费者路径时代的落地目录），已随 SyncTarget 移除，不要复用。
  reserved 3;
  reserved "target_dir";
}
