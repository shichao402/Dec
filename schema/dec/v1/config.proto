syntax = "proto3";

package dec.v1;

option go_package = "github.com/shichao402/Dec/schema/dec/v1;decv1";

import "dec/v1/assets.proto";

// GlobalConfig 对应 ~/.dec/config.yaml。
message GlobalConfig {
  string repo_url = 1 [json_name = "repo_url"];
  repeated string ides = 2;
  string editor = 3;
}

// ProjectConfig 对应 <workspace>/.dec/config.yaml（version v2）。
// 本地配置以 project_name 引用 Git Vault 中的 projects/<name>.yaml；
// enabled_bundles 为从 vault Project 同步或 Assets 页调整后的本地副本，供 pull 解析。
message ProjectConfig {
  string version = 1;
  // 引用的 vault Project 名，对应 projects/<project_name>.yaml。
  string project_name = 2 [json_name = "project_name"];
  // 机器级 IDE 覆盖（可选）；未设置时继承 vault Project.ides → 全局 ides。
  repeated string ides = 3;
  // 机器级 editor 覆盖（可选）。
  string editor = 4;
  // TUI Assets 页扫描远端 bundles/ 生成的可用资产清单（本地缓存）。
  AssetInventory available = 5;
  // 单资产粒度启用（高级）；多数场景由 project.bundles 推导。
  AssetInventory enabled = 6;
  // 从 vault Project.bundles 同步或 Assets 页保存的 bundle 列表；pull 时据此拉 Dec + secrets bundle。
  repeated string enabled_bundles = 7 [json_name = "enabled_bundles"];
}
