# ============================================================================
# 公网 443 的 SNI 分流（2026-10-23，由 Dec 实现代理配置）
#
# 为什么不在 http 里终止 TLS：
#   dec.firoyang.com 的设备身份靠 TLS 客户端证书（双向 TLS），ACME 证书也由
#   dec-cloud 自己用 TLS-ALPN-01 在 443 这条连接上申请续期。nginx 一旦解密，
#   设备证书到不了 dec-cloud，所有设备都会 unauthorized，证书也无法自动续期。
#   所以 dec 的流量只按 SNI 原样透传，nginx 不碰 TLS 内容。
#
# 流向：
#   公网 :443 ──(ssl_preread 读 SNI，附加 PROXY protocol 头)──┬─ dec.firoyang.com → 127.0.0.1:8445（纯字节透传）→ dec-cloud 127.0.0.1:8444
#                                                            └─ 其他域名         → 127.0.0.1:4443（http 里的各 HTTPS 站点，带 proxy_protocol）
#
# PROXY protocol 的作用：让 http 里的站点仍能拿到真实客户端 IP（见 conf.d/00-proxy-protocol-realip.conf）；
# dec-cloud 在 listener 层自己解析它（-proxy-protocol，默认开启），所以来源 IP 是真实的公网地址，
# 下载限流也按真实来源分桶。
#
# 约束：
#   - 新增 HTTPS 站点：listen 127.0.0.1:4443 ssl proxy_protocol;  不要再写 listen 443。
#   - dec-cloud 的端口以 systemd 单元 dec-cloud.service 的 -listen 为准（当前 127.0.0.1:8444），改了要同步这里。
#   - 回滚：还原 /root/nginx-backup-*.tar.gz 中的 /etc/nginx。
# ============================================================================
stream {
    map $ssl_preread_server_name $sni_backend {
        dec.firoyang.com  127.0.0.1:8445;
        default           127.0.0.1:4443;
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $sni_backend;
        proxy_connect_timeout 10s;
        # dec-agent 长轮询 30s，留足余量。
        proxy_timeout 3600s;
    }

    # dec-cloud 现在会解析 PROXY 头（-proxy-protocol=true，默认开启），
    # 所以这一跳只需把 443 写好的头原样送到 8444，**不能碰它**。
    #
    # 关键：这里既不能写 `listen ... proxy_protocol`，也不能写 `proxy_protocol on`。
    #   - `listen ... proxy_protocol` 会让 nginx 在这一跳**消费**443 传来的头，
    #     头被吃掉后就再也没有真实来源了。
    #   - `proxy_protocol on` 让 nginx 向上游**重新生成**一个头，用的是本机对端地址
    #     （127.0.0.1 → 127.0.0.1），真实来源同样丢失。
    # 两者同时写就是"消费再重新生成"，抓包看到的正是
    #   PROXY TCP4 127.0.0.1 127.0.0.1 <port> 8445
    # 而不是 443 传来的真实地址。这一条是实测踩出来的（2026-10-26）。
    #
    # 为什么之前要剥：dec-cloud 早期不认这个头，TLS 握手会读到一个莫名其妙的
    # 文本前缀而直接失败，所以中间加了一跳把它剥掉。代价是 dec-cloud 看到的
    # 来源 IP 永远是 127.0.0.1——这不只让审计里 remote_ip 没有取证价值，
    # 更要紧的是下载限流按 IP 分桶（每分钟 30 次），所有公网请求共用一个桶，
    # 任意爬虫都能把正常用户的额度刷光。
    #
    # 灰度顺序（不能反）：先部署能解析的服务端（默认开启，且对不带头连接兼容），
    # 再改这里。反过来的话，旧服务端会收到它不认识的文本前缀，TLS 握手失败，
    # 所有设备立刻断连。
    server {
        listen 127.0.0.1:8445;
        proxy_pass 127.0.0.1:8444;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}
