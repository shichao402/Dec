syntax = "proto3";

package secrets.v1;

option go_package = "github.com/shichao402/Dec/schema/secrets/v1;secretsv1";

import "secrets/v1/config.proto";

enum SecretKind {
  SECRET_KIND_UNSPECIFIED = 0;
  // 机器级 SSH 私钥，如 ~/.ssh/dec_vikunja_deploy
  SECRET_KIND_SSH_KEY = 1;
  // 项目根相对落地路径的配置类文件（如 .config/mise/conf.d/vikunja.toml）
  SECRET_KIND_ENV_FILE = 2;
  // Secure Note：名称 = 项目根相对路径，内容 = 文件正文
  SECRET_KIND_CONFIG_NOTE = 3;
  // include 链元数据（bundle 内引用其他 secrets bundle 资源）
  SECRET_KIND_INCLUDE_NOTE = 4;
}

// SecretRef 是 Bitwarden 资源的轻量引用（不含 secret 明文）。
// folder 指向 secrets bundle 根（与 Dec bundle 同名/绑定）。
message SecretRef {
  string item_id = 1 [json_name = "item_id"];
  string folder = 2;
  SecretKind kind = 3;
  string name = 4;
  // 项目根相对落地路径（Secure Note 名），如 .config/mise/conf.d/vikunja.toml
  string relative_path = 6 [json_name = "relative_path"];
  // include 链归因：资源实际来源 secrets bundle；本 bundle 自有时为空。
  string source_folder = 5 [json_name = "source_folder"];
}

message SyncState {
  string synced_at = 1 [json_name = "synced_at"];
  string remote_revision_at = 2 [json_name = "remote_revision_at"];
  string local_modified_at = 3 [json_name = "local_modified_at"];
  string last_synced_at = 4 [json_name = "last_synced_at"];
  string conflict = 5; // "" 或 "pending"
}

// SSHKeyRef 记录机器级 ~/.ssh/ 落地元数据（不进项目根）。
message SSHKeyRef {
  string item_id = 1 [json_name = "item_id"];
  // Bitwarden Item Name（逻辑名，如 deploy）
  string key_name = 2 [json_name = "key_name"];
  string folder = 3;
  string source_folder = 4 [json_name = "source_folder"];
  // Bitwarden Notes：关联 host，一行一个
  repeated string hosts = 5;
  // 私钥绝对路径，如 ~/.ssh/dec_vikunja_deploy
  string key_file = 6 [json_name = "key_file"];
  // 公钥绝对路径，如 ~/.ssh/dec_vikunja_deploy.pub
  string pub_file = 7 [json_name = "pub_file"];
  string added_at = 8 [json_name = "added_at"];
  string fingerprint = 9;
  string stored_at = 10 [json_name = "stored_at"];
}

message NoteRef {
  string item_id = 1 [json_name = "item_id"];
  string folder = 2;
  string source_folder = 3 [json_name = "source_folder"];
  string target_dir = 4 [json_name = "target_dir"];
  string file_name = 5 [json_name = "file_name"];
  string file_path = 6 [json_name = "file_path"];
  string content_hash = 7 [json_name = "content_hash"];
  string synced_at = 8 [json_name = "synced_at"];
  string remote_revision_at = 9 [json_name = "remote_revision_at"];
  string local_modified_at = 10 [json_name = "local_modified_at"];
  string last_synced_at = 11 [json_name = "last_synced_at"];
  string conflict = 12;
}

// EnvEntry 记录 mise env 等私密配置的同步元数据（Note 名 = 项目根相对路径）。
message EnvEntry {
  string item_id = 1 [json_name = "item_id"];
  string folder = 2;
  string source_folder = 3 [json_name = "source_folder"];
  string name = 4;
  repeated string keys = 5;
  string json_path = 6 [json_name = "json_path"];
  string shell_path = 7 [json_name = "shell_path"];
  string powershell_path = 8 [json_name = "powershell_path"];
  string set_at = 9 [json_name = "set_at"];
}

// SyncStateFile 对应 ~/.dec/secrets/state.json（JSON wire format，字段 snake_case）。
// 仅记录同步元数据（SSH key、note、env、bundle 绑定）；不含 Bitwarden session。
// Session 仅在 Dec/TUI 进程内存中保存，禁止落盘。
message SyncStateFile {
  repeated SSHKeyRef ssh_keys = 1 [json_name = "ssh_keys"];
  repeated NoteRef notes = 2;
  repeated EnvEntry envs = 3;
  repeated BundleBinding bundles = 5;
}
