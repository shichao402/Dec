[package]
name = "app"
version = "0.1.0"
description = "Dec 管理客户端"
authors = ["Dec"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
