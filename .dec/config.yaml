# Dec 项目配置
# version: 配置结构版本；当前固定为 v2
# ides: 项目级 IDE 覆盖（可选），例如：
#   ides:
#     - cursor
#     - codex
# editor: 项目级交互式编辑器，覆盖全局配置（可选），例如：
#   editor: code --wait
#   editor: vim
# enabled_bundles: 按 package 启用资产（推荐）；package 名通常与 vault 同名
#   enabled_bundles:
#     - vikunja
#     - cli
# available / enabled: 单资产粒度（高级用法）；多数场景请优先使用 enabled_bundles
#   my-vault:
#     my-asset:
#       skills: true
#       rules: true

version: v2
project_name: Dec
available:
    cli:
        cli-release-rules:
            rules: true
        cli-release-workflow:
            skills: true
    default:
        helloworld:
            skills: true
        project-workflow:
            skills: true
    tencent-cloud:
        tencent-cloud:
            skills: true
            mcp: true
    vikunja:
        vikunja-integration:
            rules: true
        vikunja-issue:
            skills: true
        vikunja-mcp:
            mcp: true
        vikunja-project-bootstrap:
            skills: true
        vikunja-workflow:
            skills: true
enabled:
    vikunja:
        vikunja-integration:
            rules: true
        vikunja-issue:
            skills: true
        vikunja-mcp:
            mcp: true
        vikunja-project-bootstrap:
            skills: true
        vikunja-workflow:
            skills: true
enabled_bundles:
    - cli
    - default
